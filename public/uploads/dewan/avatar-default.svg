<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradDef" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="avatarGradDef" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="400" fill="url(#bgGradDef)"/>
  
  <!-- Subtle circular accent behind avatar -->
  <circle cx="160" cy="180" r="115" fill="#ffffff" opacity="0.6"/>
  <circle cx="160" cy="180" r="105" fill="#cbd5e1" opacity="0.2"/>

  <!-- Head -->
  <circle cx="160" cy="130" r="50" fill="url(#avatarGradDef)"/>

  <!-- Torso & Shoulders -->
  <path d="M 70 270 C 70 200, 110 180, 160 180 C 210 180, 250 200, 250 270 L 250 400 L 70 400 Z" fill="url(#avatarGradDef)"/>
</svg>
