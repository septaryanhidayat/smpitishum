<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="circleAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.08"/>
    </linearGradient>
    <!-- Avatar Gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="collarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="320" height="400" fill="url(#cardBg)"/>

  <!-- Decorative Abstract Rings & Badges -->
  <circle cx="160" cy="175" r="120" fill="url(#circleAccent)"/>
  <circle cx="160" cy="175" r="100" fill="#ffffff" opacity="0.75" filter="url(#softShadow)"/>
  <circle cx="160" cy="175" r="92" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.35"/>

  <!-- Head / Face Silhouette -->
  <circle cx="160" cy="135" r="46" fill="#0f766e" opacity="0.9"/>
  <circle cx="160" cy="135" r="42" fill="#0d9488"/>

  <!-- Neat Inner Face Contour -->
  <circle cx="160" cy="142" r="32" fill="#f8fafc" opacity="0.95"/>

  <!-- Torso / Formal Educator Attire with Collar & Tie -->
  <!-- Shoulders & Coat -->
  <path d="M 65 310 C 65 225, 105 198, 160 198 C 215 198, 255 225, 255 310 L 265 400 L 55 400 Z" fill="url(#bodyGrad)"/>

  <!-- White Shirt Collar -->
  <polygon points="160,202 142,248 178,248" fill="url(#collarGrad)"/>
  <polygon points="160,248 153,300 167,300" fill="url(#accentGold)"/>
  
  <!-- Coat Lapels -->
  <path d="M 125 208 L 146 270 L 128 310 L 105 310 Z" fill="#334155" opacity="0.6"/>
  <path d="M 195 208 L 174 270 L 192 310 L 215 310 Z" fill="#334155" opacity="0.6"/>

  <!-- Educator Identity Badge / Emblem at Bottom -->
  <g transform="translate(160, 345)">
    <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#ffffff" filter="url(#softShadow)" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Icon Book / Graduation -->
    <path d="M -46 -4 L -38 0 L -38 6 L -46 2 Z M -36 0 L -28 -4 L -28 2 L -36 6 Z" fill="#0d9488"/>
    <text x="5" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">TENAGA PENDIDIK</text>
  </g>
</svg>
